# Keeps the GitHub Pages preview up to date.
# Pages is set to "Deploy from a branch" (main, root): the root index.html forwards to preview/,
# and this workflow rebuilds preview/ whenever the site source changes, then commits it.
# Commits made with GITHUB_TOKEN do not trigger new workflow runs, so this cannot loop.
name: Rebuild Pages preview

on:
  push:
    branches: [main]
    paths: ['src/**', 'build.mjs']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preview-build
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build production site (sanity check)
        run: node build.mjs
      - name: Build preview into preview/
        run: OUT_DIR=preview PREVIEW=1 node build.mjs
      - name: Commit updated preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview
          if git diff --cached --quiet; then echo "Preview already up to date"; else git commit -m "Rebuild Pages preview" && git push; fi
